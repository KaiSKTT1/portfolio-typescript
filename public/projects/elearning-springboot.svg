<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6db33f"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="700" cy="80" r="180" fill="#6db33f" opacity="0.12"/>
  <circle cx="100" cy="380" r="150" fill="#10b981" opacity="0.1"/>
  <!-- Code Window -->
  <rect x="60" y="55" width="680" height="340" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="2"/>
  <circle cx="90" cy="82" r="7" fill="#ef4444"/>
  <circle cx="112" cy="82" r="7" fill="#f59e0b"/>
  <circle cx="134" cy="82" r="7" fill="#22c55e"/>
  <text x="160" y="87" fill="#64748b" font-family="monospace" font-size="14">ElearningApplication.java — Spring Boot 3.5 • Java 21</text>
  <line x1="60" y1="105" x2="740" y2="105" stroke="#1e293b" stroke-width="2"/>
  <!-- Spring Boot Logo Hexagon -->
  <g transform="translate(550, 165)">
    <polygon points="70,0 130,35 130,105 70,140 10,105 10,35" fill="#6db33f" fill-opacity="0.18" stroke="#6db33f" stroke-width="3"/>
    <path d="M55,95 C40,80 45,50 75,40 C95,35 105,55 90,75 C78,90 60,92 55,95 Z" fill="#6db33f"/>
    <circle cx="52" cy="96" r="5" fill="#ffffff"/>
  </g>
  <!-- Code Lines -->
  <text x="90" y="145" fill="#f59e0b" font-family="monospace" font-size="16" font-weight="bold">@RestController</text>
  <text x="90" y="170" fill="#f59e0b" font-family="monospace" font-size="16" font-weight="bold">@RequestMapping("/api/v1/courses")</text>
  <text x="90" y="198" fill="#38bdf8" font-family="monospace" font-size="16">public class <tspan fill="#e2e8f0" font-weight="bold">CourseController</tspan> {</text>
  <text x="115" y="228" fill="#a78bfa" font-family="monospace" font-size="15">@PreAuthorize("hasAnyRole('ADMIN', 'INSTRUCTOR')")</text>
  <text x="115" y="253" fill="#34d399" font-family="monospace" font-size="15">JwtAuthenticationFilter • RBAC • MySQL 8.0</text>
  <text x="90" y="280" fill="#38bdf8" font-family="monospace" font-size="16">}</text>
  <!-- Badges -->
  <rect x="90" y="315" width="145" height="36" rx="8" fill="#6db33f" fill-opacity="0.2" stroke="#6db33f"/>
  <text x="162" y="338" fill="#86efac" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SPRING BOOT 3</text>
  <rect x="250" y="315" width="105" height="36" rx="8" fill="#f97316" fill-opacity="0.2" stroke="#f97316"/>
  <text x="302" y="338" fill="#fdba74" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">JAVA 21</text>
  <rect x="370" y="315" width="135" height="36" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8"/>
  <text x="437" y="338" fill="#7dd3fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">JWT &amp; RBAC</text>

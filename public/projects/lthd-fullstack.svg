<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <rect x="60" y="55" width="680" height="340" rx="16" fill="#090d16" fill-opacity="0.88" stroke="#1e293b" stroke-width="2"/>
  <circle cx="90" cy="82" r="7" fill="#ef4444"/>
  <circle cx="112" cy="82" r="7" fill="#f59e0b"/>
  <circle cx="134" cy="82" r="7" fill="#22c55e"/>
  <text x="160" y="87" fill="#64748b" font-family="monospace" font-size="14">Fullstack Architecture — React 19 + Spring Boot + Redis</text>
  <line x1="60" y1="105" x2="740" y2="105" stroke="#1e293b" stroke-width="2"/>

  <!-- React Atom Icon -->
  <g transform="translate(185, 200)">
    <ellipse rx="65" ry="24" fill="none" stroke="#38bdf8" stroke-width="3" transform="rotate(30)"/>
    <ellipse rx="65" ry="24" fill="none" stroke="#38bdf8" stroke-width="3" transform="rotate(90)"/>
    <ellipse rx="65" ry="24" fill="none" stroke="#38bdf8" stroke-width="3" transform="rotate(150)"/>
    <circle r="10" fill="#38bdf8"/>
    <text x="0" y="85" fill="#7dd3fc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">React 19 + Vite</text>
  </g>

  <!-- Plus / Arrow -->
  <text x="350" y="208" fill="#64748b" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">⇄</text>

  <!-- Spring Boot Hexagon -->
  <g transform="translate(475, 200)">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#6db33f" fill-opacity="0.2" stroke="#6db33f" stroke-width="3"/>
    <text x="0" y="6" fill="#86efac" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">SPRING</text>
    <text x="0" y="85" fill="#86efac" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Spring Boot 4</text>
  </g>

  <!-- Redis Cube -->
  <g transform="translate(635, 200)">
    <rect x="-45" y="-45" width="90" height="90" rx="14" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="3"/>
    <text x="0" y="6" fill="#fca5a5" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">REDIS</text>
    <text x="0" y="85" fill="#fca5a5" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Redis Cache</text>
  </g>

  <rect x="90" y="325" width="135" height="34" rx="8" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8"/>
  <text x="157" y="347" fill="#7dd3fc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">REACT 19 &amp; TW4</text>
  <rect x="240" y="325" width="140" height="34" rx="8" fill="#6db33f" fill-opacity="0.18" stroke="#6db33f"/>
  <text x="310" y="347" fill="#86efac" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SPRING BOOT</text>
  <rect x="395" y="325" width="140" height="34" rx="8" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444"/>
  <text x="465" y="347" fill="#fca5a5" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">REDIS &amp; JWT</text>
</svg>